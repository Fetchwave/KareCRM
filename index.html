<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kare CRM</title>
<meta name="theme-color" content="#100E0E">
<link rel="icon" href="https://kareindustrial.co.za/cdn/shop/files/Kare_logo_high_qual.png?v=1760351300&width=64">
<link rel="apple-touch-icon" href="https://kareindustrial.co.za/cdn/shop/files/Kare_logo_high_qual.png?v=1760351300&width=180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Jost:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: dark Kare top bar, page content in a 1280px column; lead details open in a right-hand panel (full screen on phones) */
:root{
  --red:#AC3A3B; --red-dk:#8F2F30; --red-tint:#F8ECEC;
  --ink:#100E0E; --text:#2B2C2D; --muted:#6E6867; --faint:#9A9392;
  --line:#E6E0DF; --paper:#FFFFFF; --bg:#F6F3F2; --tint:#F1ECEB;
  --ok:#2F7D4F; --ok-tint:#E8F3EC; --warn:#A86A12; --warn-tint:#FBF1E1; --info:#2F5D8A; --info-tint:#E8EFF7; --grey-tint:#EEEAE9;
  --display:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Jost","DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:8px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:var(--r);border:1.5px solid transparent;font-family:var(--display);font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-dk)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:#2a2626}
.btn-line{background:var(--paper);color:var(--ink);border-color:var(--line)}.btn-line:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted);border-color:transparent}.btn-ghost:hover{color:var(--ink);background:var(--tint)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#25643f}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-family:var(--display);font-weight:600;font-size:13px;color:var(--text)}
.inp{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:9px 12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--red)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--red);font-size:13.5px;font-weight:500}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ink);position:relative;overflow:hidden}
.auth::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.03) 26px 27px),radial-gradient(circle at 85% 15%,rgba(172,58,59,.5),transparent 45%)}
.auth-card{position:relative;width:min(400px,100%);background:var(--paper);border-radius:14px;padding:32px 28px 28px;display:grid;gap:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.auth-logo{width:84px;height:84px;border-radius:50%;margin:-74px auto 0;background:#fff;padding:5px;box-shadow:0 0 0 5px rgba(255,255,255,.15)}
.auth-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.auth h1{font-family:var(--display);font-weight:800;font-size:26px;text-align:center;color:var(--ink);letter-spacing:-.01em}
.auth p.sub{text-align:center;color:var(--muted);margin-top:-10px}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:none}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px}
.brand b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand b span{color:#E9B3B3;font-weight:600}
.nav{display:flex;gap:4px;flex:1}
.nav a{color:rgba(255,255,255,.72);text-decoration:none;font-family:var(--display);font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--ink)}
.nav .badge{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:700}
.top-right{display:flex;align-items:center;gap:8px}
.top .btn-ghost{color:rgba(255,255,255,.75)}.top .btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.me{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;display:grid;place-items:center;border:0;font-size:14px}
.menu{position:absolute;right:16px;top:60px;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 40px -14px rgba(0,0,0,.35);min-width:220px;padding:8px;z-index:60}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block;font-family:var(--display)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px}
.menu button:hover{background:var(--tint)}

.page{max-width:1280px;margin:0 auto;padding:22px 16px 110px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.page-h h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;color:var(--ink)}
.page-h p{color:var(--muted);margin-top:2px}

.tabbar{display:none}
@media(max-width:760px){
  .nav,.top-right .hide-sm{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 4px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:11.5px;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar .on{color:var(--red)}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}
  .tabbar .add{color:#fff}
  .tabbar .add span.plus{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-top:-18px;box-shadow:0 8px 18px -6px rgba(172,58,59,.7)}
  .tabbar .add em{font-style:normal;color:var(--muted)}
}

/* ---------- cards & dashboard ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--ink)}
.card-h .hint{white-space:nowrap}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0;max-width:100%}
.page-h>div{min-width:0;max-width:100%}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi .k-v{font-size:24px}.kpi .k-l{font-size:11px}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:4px;min-width:0;text-align:left}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--red)}
.kpi .k-l{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .k-v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:13.5px;color:var(--muted)}
.kpi.alert{border-color:#E7C3C3;background:linear-gradient(0deg,var(--paper),var(--red-tint))}
.kpi.alert .k-v{color:var(--red)}

.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.span2{grid-column:1/-1}
@media(min-width:980px){.dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}

.att{display:grid;gap:8px}
.att-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);text-align:left;width:100%}
.att-row:hover{border-color:var(--red)}
.att-row b{font-family:var(--display);font-weight:700;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-row span.s{font-size:13.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.att-ic svg{width:18px;height:18px}
.att-ic.red{background:var(--red-tint);color:var(--red)}.att-ic.warn{background:var(--warn-tint);color:var(--warn)}.att-ic.info{background:var(--info-tint);color:var(--info)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--bg);border-radius:var(--r);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:2px}

/* bar charts (single hue) */
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.hbar .t{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:14px;background:var(--tint);border-radius:4px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--red);border-radius:0 4px 4px 0;min-width:2px;transition:width .4s ease}
.hbar .v{text-align:right;font-family:var(--display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hbar.muted .fill{background:#C9BDBC}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:22px;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.col .bar{width:100%;max-width:34px;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;transition:height .4s ease}
.col .bar.zero{background:var(--line)}
.col .cv{position:absolute;font-family:var(--display);font-size:12px;font-weight:700;color:var(--ink);transform:translateY(-18px);opacity:0;transition:opacity .15s}
.col:hover .cv,.col.last .cv{opacity:1}
.col:hover .bar{background:var(--red-dk)}
.col-x{display:flex;gap:6px;margin-top:6px}
.col-x span{flex:1;text-align:center;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.scroll-x{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:12.5px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--red-tint);color:var(--red)}
.s-contacted{background:var(--warn-tint);color:var(--warn)}
.s-qualified{background:var(--info-tint);color:var(--info)}
.s-quoted{background:#EFE8F6;color:#6A4A8C}
.s-won{background:var(--ok-tint);color:var(--ok)}
.s-lost{background:var(--grey-tint);color:#5E5857}
.s-disqualified{background:var(--grey-tint);color:#8A8382}
.src{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--tint);color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.ava.none{background:var(--tint);color:var(--faint);border:1px dashed #cfc5c4}
.owner{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

/* ---------- leads list ---------- */
.toolbar{display:grid;gap:10px;margin-bottom:14px}
.toolbar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--text);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--faint);font-weight:700}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on i{color:#E9B3B3}
select.inp.sm{min-height:36px;padding:6px 10px;width:auto;font-size:14px}

.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,2.2fr) 130px 130px minmax(0,1.1fr) 90px 150px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--paper);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.lrow:hover{background:#FBF9F9}
.lrow.head{cursor:default;background:var(--bg);font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:10px}
.lrow.head:hover{background:var(--bg)}
.lrow .nm b{display:block;font-family:var(--display);font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm span{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .when{font-size:13.5px;color:var(--muted);white-space:nowrap}
.lrow .when.late{color:var(--red);font-weight:600}
.lrow .val{font-family:var(--display);font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.dot-new{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
@media(max-width:900px){
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm st" "meta val";gap:6px 12px}
  .lrow.head{display:none}
  .lrow .c-nm{grid-area:nm}.lrow .c-st{grid-area:st;justify-self:end}
  .lrow .c-src,.lrow .c-own{display:none}
  .lrow .c-when{grid-area:meta}.lrow .c-val{grid-area:val}
}
.more{display:flex;justify-content:center;padding:14px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.bcol{background:var(--tint);border-radius:12px;padding:10px;min-height:200px;display:grid;gap:8px;align-content:start;border:2px dashed transparent}
.bcol.drop{border-color:var(--red);background:var(--red-tint)}
.bcol-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.bcol-h b{font-family:var(--display);font-size:14px;color:var(--ink)}
.bcol-h span{font-size:12.5px;color:var(--muted);font-weight:600}
.bcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:grab;display:grid;gap:6px;text-align:left;width:100%}
.bcard:hover{border-color:#cdbfbe}
.bcard.dragging{opacity:.4}
.bcard b{font-family:var(--display);font-weight:700;color:var(--ink);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .m{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,14,14,.45);z-index:70;animation:fade .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:71;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slide .25s cubic-bezier(.2,.8,.2,1)}
.d-head{background:var(--ink);color:#fff;padding:16px 18px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:12px}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;letter-spacing:-.01em}
.d-head .co{color:rgba(255,255,255,.7);margin-top:2px}
.d-x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none}
.d-x:hover{background:rgba(255,255,255,.2)}
.d-contact{display:flex;flex-wrap:wrap;gap:8px}
.d-contact a{background:rgba(255,255,255,.1);color:#fff;border-color:transparent}
.d-contact a:hover{background:rgba(255,255,255,.2)}
.d-body{flex:1;overflow-y:auto;padding:16px 18px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stp{display:grid;gap:6px;font-size:11.5px;font-family:var(--display);font-weight:600;color:var(--faint);text-align:center}
.stp i{height:6px;border-radius:3px;background:var(--line)}
.stp.done{color:var(--text)}.stp.done i{background:var(--red)}
.stp.cur{color:var(--red)}.stp.cur i{background:var(--red)}
.steps.closed-lost .stp.done i,.steps.closed-lost .stp.cur i{background:#B9B0AF}
.next{display:grid;gap:10px}
.next-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.next .hint{text-align:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.qa{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.qa div{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.qa div:last-child{border-bottom:0}
.qa dt{color:var(--muted)}.qa dd{margin:0;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.msg{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;color:var(--ink)}
.closed-box{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.closed-box.won{background:var(--ok-tint);color:var(--ok)}
.closed-box.lost,.closed-box.disqualified{background:var(--grey-tint);color:#5E5857}
.closed-box b{font-family:var(--display);font-size:17px}
.tl{display:grid;gap:0}
.tl-i{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl-i::before{content:"";position:absolute;left:15px;top:36px;bottom:-4px;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.tl-ic svg{width:16px;height:16px}
.tl-i.note .tl-ic{color:var(--ink)}
.tl-i.status .tl-ic{background:var(--red-tint);border-color:#EDCDCD;color:var(--red)}
.tl-t{font-size:14.5px;color:var(--ink)}
.tl-t .body{white-space:pre-wrap;color:var(--text);margin-top:2px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.tl-m{font-size:12.5px;color:var(--faint)}
.note-types{display:flex;gap:6px;flex-wrap:wrap}
.note-types button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.note-types button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sec-t{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.prod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.prod b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--red)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.modal .scrim{z-index:0}
.mbox{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.mbox.wide{width:min(640px,100%)}
.mbox h3{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.01em}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.reasons{display:grid;gap:6px}
.reasons label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-size:14.5px}
.reasons label:has(input:checked){border-color:var(--red);background:var(--red-tint)}
.reasons input{accent-color:var(--red)}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper)}
.money:focus-within{border-color:var(--red)}
.money span{padding-left:12px;font-family:var(--display);font-weight:700;color:var(--muted)}
.money input{border:0;outline:none;padding:10px 12px 10px 6px;width:100%;min-width:0;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;background:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.guide{display:grid;gap:10px}
.guide .g{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.guide .g:last-child{border-bottom:0}
.rules{background:var(--bg);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.rules li{margin-left:18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:up .25s ease}
.toast button{background:none;border:0;color:#F3C2C2;font-weight:700;font-family:var(--display);white-space:nowrap}
@media(max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  if (!d) return '';

/* ================= STATE ================= */
const S = {

  view:'dash', period:'month', dashWho:'all',

};

/* ================= AUTH ================= */
function authScreen(mode = 'login', msg = ''){
  const titles = {login:['Kare CRM','Sign in to see your leads'], forgot:['Reset password','We will email you a link'], set:['Set your password','Choose a password to finish setting up']};
  $('#app').innerHTML = `
  <div class="auth"><form class="auth-card" id="authForm" novalidate>
    <div class="auth-logo"><img src="${LOGO}" alt="Kare Industrial Suppliers"></div>
    <h1>${titles[mode][0]}</h1><p class="sub">${titles[mode][1]}</p>
    ${mode !== 'set' ? `<div class="field"><label for="a-email">Email</label><input class="inp" id="a-email" type="email" autocomplete="username" required></div>` : ''}
    ${mode !== 'forgot' ? `<div class="field"><label for="a-pass">${mode === 'set' ? 'New password' : 'Password'}</label><input class="inp" id="a-pass" type="password" autocomplete="${mode === 'set' ? 'new-password' : 'current-password'}" minlength="8" required>${mode === 'set' ? '<span class="hint">At least 8 characters.</span>' : ''}</div>` : ''}
    <p class="err" id="a-err" ${msg ? '' : 'hidden'}>${esc(msg)}</p>
    <button class="btn btn-red" type="submit">${mode === 'login' ? 'Sign in' : mode === 'forgot' ? 'Send reset link' : 'Save password'}</button>
    ${mode === 'login' ? '<button class="btn btn-ghost btn-sm" type="button" data-auth="forgot">Forgot your password?</button>' : mode === 'forgot' ? '<button class="btn btn-ghost btn-sm" type="button" data-auth="login">Back to sign in</button>' : ''}
  </form></div>`;
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#authForm button[type=submit]'), err = $('#a-err');
    const email = $('#a-email')?.value.trim(), pass = $('#a-pass')?.value;
    err.hidden = true; btn.disabled = true;
    try {
      if (mode === 'login') {
        const {error} = await sb.auth.signInWithPassword({email, password:pass});
        if (error) throw new Error('That email and password don\'t match. Try again or reset your password.');
      } else if (mode === 'forgot') {
        const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
        if (error) throw error;
        err.hidden = false; err.style.color = 'var(--ok)'; err.textContent = 'Check your email for the reset link.';
      } else {
        if (!pass || pass.length < 8) throw new Error('Use at least 8 characters.');
        const {error} = await sb.auth.updateUser({password:pass});
        if (error) throw error;
        history.replaceState(null, '', location.pathname);
        boot();
      }
    } catch (x) { err.hidden = false; err.style.color = ''; err.textContent = x.message || 'Something went wrong. Try again.'; }
    btn.disabled = false;
  };
  $$('[data-auth]').forEach(b => b.onclick = () => authScreen(b.dataset.auth));
}

const needsPassword = /type=(invite|recovery)/.test(location.hash);
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { S.session = session; authScreen('set'); return; }
  if (event === 'SIGNED_IN' && !S.loaded && !needsPassword) { S.session = session; boot(); }
  if (event === 'SIGNED_OUT') { S.loaded = false; S.session = null; authScreen('login'); }
});

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { authScreen('login'); return; }
  if (needsPassword && !S.passwordDone) { S.passwordDone = true; S.session = session; authScreen('set'); return; }
  S.session = session;
  $('#app').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  const [{data:team}, {data:leads, error}] = await Promise.all([
    sb.from('profiles').select('*').order('full_name'),
    sb.from('leads').select('id,created_at,updated_at,source,form_name,page_url,name,email,phone,company,city,message,products,answers,utm_source,utm_medium,utm_campaign,utm_content,fbclid,gclid,referrer,status,owner_id,quote_value,value,disqualify_reason,lost_reason,next_action_at,first_contact_at,closed_at,last_activity_at').order('created_at', {ascending:false}).limit(5000)
  ]);
  S.team = team || [];
  S.me = S.team.find(p => p.id === session.user.id);
  if (!S.me || !S.me.active) {
    $('#app').innerHTML = `<div class="auth"><div class="auth-card"><div class="auth-logo"><img src="${LOGO}" alt=""></div><h1>Almost there</h1><p class="sub">Your account isn't switched on yet. Ask your Kare CRM admin to activate it.</p><button class="btn btn-line" id="so">Sign out</button></div></div>`;
    $('#so').onclick = () => sb.auth.signOut();
    return;
  }
  if (error) { toast('Could not load leads: ' + error.message); }
  S.leads = leads || [];
  S.loaded = true;
  shell(); route(); live();
}

window.addEventListener('hashchange', () => S.loaded && route());
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith('lead/')) { const id = h.slice(5); if (!['dash','leads','team'].includes(S.view)) S.view = 'leads'; render(); openLead(id); return; }
  S.view = ['dash','leads','team'].includes(h) ? h : 'dash';
  render();
}
function render(){
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === S.view));
  const n = S.leads.filter(l => l.status === 'new').length;
  $$('[data-newcount]').forEach(b => { b.hidden = !n; b.textContent = n; });
  if (S.view === 'dash') renderDash();
  else if (S.view === 'leads') renderLeads();
  else renderTeam();

function globalClick(e){
  const t = e.target.closest('[data-act],[data-lead]');
  const menu = $('.menu');
  if (menu && !e.target.closest('.menu') && !e.target.closest('[data-act=menu]')) menu.remove();
  if (!t) return;
  if (t.dataset.lead) { e.preventDefault(); openLead(t.dataset.lead); return; }
  const a = t.dataset.act;
  if (a === 'add') addLeadModal();
  if (a === 'guide') guideModal();
  if (a === 'menu') {
    if (menu) { menu.remove(); return; }
    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = `<div class="who"><b>${esc(S.me.full_name)}</b><span class="hint">${esc(S.me.email || '')} · ${S.me.role === 'admin' ? 'Admin' : 'Sales'}</span></div>
      <button data-act="rename">Change my name</button><button data-act="guide">How it works</button><button data-act="signout">Sign out</button>`;
    document.body.appendChild(m);
  }
  if (a === 'signout') sb.auth.signOut();
  if (a === 'rename') { $('.menu')?.remove(); renameModal(); }
  if (a === 'go-leads') { Object.assign(S, t.dataset.stage ? {stage:t.dataset.stage} : {}, t.dataset.who ? {who:t.dataset.who} : {}); location.hash = 'leads'; }
}

/* ================= DASHBOARD ================= */
function periodStart(p){
  const d = new Date(); d.setHours(0,0,0,0);
  if (p === 'month') { d.setDate(1); return d; }
  if (p === '30') return new Date(Date.now() - 30*DAY);
  if (p === 'quarter') { d.setDate(1); d.setMonth(Math.floor(d.getMonth()/3)*3); return d; }
  if (p === 'year') { d.setMonth(0, 1); return d; }
  return new Date(0);
}
function renderDash(){
  const from = periodStart(S.period).getTime();
  const mine = S.dashWho === 'me';
  const pool = mine ? S.leads.filter(l => l.owner_id === S.me.id) : S.leads;
  const inP = l => new Date(l.created_at).getTime() >= from;
  const closedInP = l => l.closed_at && new Date(l.closed_at).getTime() >= from;
  const created = pool.filter(inP);
  const won = pool.filter(l => l.status === 'won' && closedInP(l));
  const lost = pool.filter(l => l.status === 'lost' && closedInP(l));
  const dq = pool.filter(l => l.status === 'disqualified' && closedInP(l));
  const wonVal = won.reduce((s,l) => s + Number(l.value||0), 0);
  const winRate = won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) : null;
  const waiting = pool.filter(l => l.status === 'new');
  const oldestWait = waiting.length ? Math.max(...waiting.map(l => Date.now() - new Date(l.created_at))) : 0;
  const resp = created.filter(l => l.first_contact_at).map(l => new Date(l.first_contact_at) - new Date(l.created_at)).filter(x => x >= 0);
  const avgResp = resp.length ? resp.reduce((a,b) => a+b, 0) / resp.length : null;
  const pipe = pool.filter(l => l.status === 'quoted');
  const pipeVal = pipe.reduce((s,l) => s + Number(l.quote_value||0), 0);

  // needs attention
  const eod = endOfToday().getTime();
  const att = [];
  pool.filter(l => l.status === 'new').forEach(l => att.push({l, k:0, t:new Date(l.created_at).getTime(), ic:'red', icon:ICON.bell, s:`New lead · waiting ${dur(Date.now() - new Date(l.created_at))}${SOURCES[l.source] ? ' · ' + SOURCES[l.source] : ''}`}));
  pool.filter(l => OPEN.includes(l.status) && l.status !== 'new' && l.next_action_at && new Date(l.next_action_at).getTime() <= eod)
      .forEach(l => att.push({l, k:1, t:new Date(l.next_action_at).getTime(), ic:'warn', icon:ICON.clock, s:`Follow-up ${new Date(l.next_action_at).getTime() < Date.now() - DAY ? 'overdue since ' + dateOnly(l.next_action_at) : 'due today'} · ${SL[l.status]}`}));
  pool.filter(l => l.status === 'quoted' && !l.next_action_at && Date.now() - new Date(l.last_activity_at) > 5*DAY)
      .forEach(l => att.push({l, k:2, t:new Date(l.last_activity_at).getTime(), ic:'info', icon:ICON.doc, s:`Quote sent · no contact for ${Math.round((Date.now() - new Date(l.last_activity_at))/DAY)} days`}));
  att.sort((a,b) => a.k - b.k || a.t - b.t);

  // weeks
  const weeks = [];
  const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
  let w0 = monday(new Date());
  for (let i = 11; i >= 0; i--) { const s = new Date(w0); s.setDate(s.getDate() - 7*i); weeks.push({s, n:0}); }
  pool.forEach(l => { const t = new Date(l.created_at); for (let i = weeks.length-1; i >= 0; i--) { if (t >= weeks[i].s) { if (i < weeks.length-1 || true) weeks[i].n++; break; } } });
  const wmax = Math.max(1, ...weeks.map(w => w.n));

  // by source / where now / reasons / team
  const cnt = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); if (k) m[k] = (m[k]||0) + 1; }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
  const bySrc = cnt(created, l => SOURCES[l.source] || l.source);
  const where = STAGES.map(s => [s.label, created.filter(l => l.status === s.k).length, s.k]);
  const reasons = cnt([...lost, ...dq], l => (l.status === 'lost' ? 'Lost: ' : 'Not a lead: ') + ((l.status === 'lost' ? l.lost_reason : l.disqualify_reason) || 'No reason given'));
  const teamRows = S.team.filter(p => p.active).map(p => {
    const mineL = S.leads.filter(l => l.owner_id === p.id);
    const w = mineL.filter(l => l.status === 'won' && closedInP(l));
    return {p, open: mineL.filter(l => OPEN.includes(l.status)).length, assigned: mineL.filter(inP).length, won: w.length, val: w.reduce((s,l) => s + Number(l.value||0), 0)};
  }).sort((a,b) => b.val - a.val || b.won - a.won || b.open - a.open);
  const unassigned = S.leads.filter(l => !l.owner_id && OPEN.includes(l.status)).length;

  const hbars = (rows, max, opts = {}) => rows.length ? `<div class="hbars">${rows.map(([t,v,k]) => `<div class="hbar ${opts.mutedZero && !v ? 'muted' : ''}" ${k ? `title="${esc(t)}: ${v}"` : ''}><span class="t">${esc(t)}</span><span class="track"><span class="fill" style="width:${max ? Math.max(v ? 3 : 0, v/max*100) : 0}%"></span></span><span class="v">${v}</span></div>`).join('')}</div>` : `<div class="empty">Nothing here yet for this period.</div>`;

  $('#page').innerHTML = `
  <div class="page-h">
    <div><h1>${greeting()}, ${esc(S.me.full_name.split(' ')[0])}</h1><p>${waiting.length ? `${waiting.length} new ${waiting.length === 1 ? 'lead is' : 'leads are'} waiting for a first call.` : 'Every new lead has been contacted. Nice work.'}</p></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Period">${[['month','This month'],['30','Last 30 days'],['quarter','This quarter'],['year','This year'],['all','All time']].map(([k,t]) => `<button data-period="${k}" class="${S.period === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="Whose leads">${[['all','Everyone'],['me','Just me']].map(([k,t]) => `<button data-dwho="${k}" class="${S.dashWho === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    </div>
  </div>
  <div class="kpis">
    <button class="kpi" data-act="go-leads" data-stage="all"><span class="k-l">New leads</span><span class="k-v">${created.length}</span><span class="k-s">came in ${periodText()}</span></button>
    <button class="kpi ${waiting.length ? 'alert' : ''}" data-act="go-leads" data-stage="new"><span class="k-l">Waiting for a call</span><span class="k-v">${waiting.length}</span><span class="k-s">${waiting.length ? 'oldest waiting ' + dur(oldestWait) : 'all contacted'}</span></button>
    <div class="kpi"><span class="k-l">Won</span><span class="k-v">${Rk(wonVal)}</span><span class="k-s">${won.length} ${won.length === 1 ? 'order' : 'orders'} ${periodText()}</span></div>
    <div class="kpi"><span class="k-l">Win rate</span><span class="k-v">${winRate == null ? '–' : winRate + '%'}</span><span class="k-s">${won.length + lost.length ? `${won.length} of ${won.length + lost.length} decided quotes` : 'no quotes decided yet'}</span></div>
    <button class="kpi" data-act="go-leads" data-stage="quoted"><span class="k-l">Quotes out</span><span class="k-v">${Rk(pipeVal)}</span><span class="k-s">${pipe.length} ${pipe.length === 1 ? 'quote' : 'quotes'} waiting on a decision</span></button>
    <div class="kpi"><span class="k-l">First call speed</span><span class="k-v">${dur(avgResp)}</span><span class="k-s">average time to first contact</span></div>
  </div>
  <div class="dash">
    <section class="card"><div class="card-h"><h2>Needs your attention</h2><span class="hint">${att.length} ${att.length === 1 ? 'item' : 'items'}</span></div>
      ${att.length ? `<div class="att">${att.slice(0,8).map(a => `<button class="att-row" data-lead="${a.l.id}"><span class="att-ic ${a.ic}">${a.icon}</span><span style="min-width:0"><b>${esc(a.l.name || a.l.email || 'No name')}${a.l.company ? ' · ' + esc(a.l.company) : ''}</b><span class="s">${a.s}</span></span><span class="owner">${avatar(a.l.owner_id)}</span></button>`).join('')}${att.length > 8 ? `<button class="btn btn-line btn-sm" data-act="go-leads" data-stage="open">See all ${att.length}</button>` : ''}</div>`
      : `<div class="empty"><b>All clear</b>No new leads waiting and no follow-ups due today.</div>`}
    </section>
    <div class="stack">
    <section class="card"><div class="card-h"><h2>Where ${periodText()}'s leads are now</h2><span class="hint">${created.length} leads</span></div>
      ${created.length ? hbars(where, Math.max(...where.map(w => w[1])), {mutedZero:true}) : '<div class="empty">No leads came in during this period.</div>'}
    </section>
    <section class="card"><div class="card-h"><h2>Where leads come from</h2><span class="hint">${periodText()}</span></div>${hbars(bySrc, bySrc[0]?.[1] || 0)}</section>
    </div>
    <section class="card"><div class="card-h"><h2>Leads per week</h2><span class="hint">last 12 weeks</span></div>
      <div class="cols" role="img" aria-label="Leads per week for the last 12 weeks">${weeks.map((w,i) => `<div class="col ${i === weeks.length-1 ? 'last' : ''}" title="Week of ${w.s.toLocaleDateString('en-ZA',{day:'numeric',month:'short'})}: ${w.n} leads"><span class="cv" style="bottom:${w.n/wmax*100}%">${w.n}</span><span class="bar ${w.n ? '' : 'zero'}" style="height:${w.n ? Math.max(3, w.n/wmax*100) : 1}%"></span></div>`).join('')}</div>
      <div class="col-x">${weeks.map((w,i) => `<span>${i % 2 === 1 || i === weeks.length-1 ? w.s.toLocaleDateString('en-ZA',{day:'numeric',month:'short'}) : ''}</span>`).join('')}</div>
    </section>
    <section class="card"><div class="card-h"><h2>Why leads don't buy</h2><span class="hint">${periodText()}</span></div>
      ${reasons.length ? hbars(reasons.slice(0,7), reasons[0][1]) + '<p class="hint" style="margin-top:12px">Pick a reason every time you mark a lead Lost or Disqualified. This list shows you what to fix.</p>' : '<div class="empty">No lost or disqualified leads in this period.</div>'}
    </section>
    <section class="card span2"><div class="card-h"><h2>Team</h2><span class="hint">won ${periodText()}</span></div>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Person</th><th class="r">Open leads</th><th class="r">Won</th><th class="r">Won value</th></tr></thead><tbody>
      ${teamRows.map(r => `<tr><td><span class="owner">${avatar(r.p.id)}${esc(r.p.full_name)}</span></td><td class="r num">${r.open}</td><td class="r num">${r.won}</td><td class="r num"><b>${R(r.val)}</b></td></tr>`).join('')}
      <tr><td><button class="btn btn-ghost btn-sm" style="padding-left:0" data-act="go-leads" data-who="none" data-stage="open"><span class="owner"><span class="ava none">?</span>Unassigned</span></button></td><td class="r num">${unassigned}</td><td class="r">–</td><td class="r">–</td></tr>
      </tbody></table></div>
    </section>
  </div>`;
  $$('[data-period]').forEach(b => b.onclick = () => { S.period = b.dataset.period; renderDash(); });
  $$('[data-dwho]').forEach(b => b.onclick = () => { S.dashWho = b.dataset.dwho; renderDash(); });
}
function periodText(){ return {month:'this month', '30':'the last 30 days', quarter:'this quarter', year:'this year', all:'all time'}[S.period]; }
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function avatar(id){ const p = person(id); return p ? `<span class="ava" title="${esc(p.full_name)}">${esc(initials(p.full_name))}</span>` : '<span class="ava none" title="Unassigned">?</span>'; }

/* ================= LEADS ================= */
function filtered(){
  const q = S.q.trim().toLowerCase();
  return S.leads.filter(l => {
    if (S.stage === 'open' && !OPEN.includes(l.status)) return false;
    if (!['open','all'].includes(S.stage) && l.status !== S.stage) return false;
    if (S.who === 'me' && l.owner_id !== S.me.id) return false;
    if (S.who === 'none' && l.owner_id) return false;
    if (S.source !== 'all' && l.source !== S.source) return false;
    if (q) {
      const hay = [l.name, l.email, l.phone, l.company, l.city, l.message, ...(l.products||[]).map(p => p.title)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderLeads(){
  const counts = {open: S.leads.filter(l => OPEN.includes(l.status)).length, all: S.leads.length};
  STAGES.forEach(s => counts[s.k] = S.leads.filter(l => l.status === s.k).length);
  const chips = [['open','All open'], ...STAGES.map(s => [s.k, s.label]), ['all','Everything']];
  $('#page').innerHTML = `
  <div class="page-h"><div><h1>Leads</h1><p>Tap a lead to see everything about it and move it forward.</p></div>
    <div class="filters"><div class="seg" role="group" aria-label="View"><button data-layout="list" class="${S.layout === 'list' ? 'on' : ''}">List</button><button data-layout="board" class="${S.layout === 'board' ? 'on' : ''}">Board</button></div></div>
  </div>
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search">${ICON.search}<input class="inp" id="q" type="search" placeholder="Search name, company, phone, product…" value="${esc(S.q)}" aria-label="Search leads"></div>
      <select class="inp sm" id="who" aria-label="Owner"><option value="all">Everyone's leads</option><option value="me">My leads</option><option value="none">Unassigned</option></select>
      <select class="inp sm" id="src" aria-label="Source"><option value="all">All sources</option>${Object.entries(SOURCES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    </div>
    ${S.layout === 'list' ? `<div class="chips" role="group" aria-label="Stage">${chips.map(([k,t]) => `<button class="chip ${S.stage === k ? 'on' : ''}" data-stage="${k}">${t} <i>${counts[k]}</i></button>`).join('')}</div>` : ''}
  </div>
  <div id="lv"></div>`;
  $('#who').value = S.who; $('#src').value = S.source;
  $('#q').oninput = e => { S.q = e.target.value; S.shown = 60; drawLeads(); };
  $('#who').onchange = e => { S.who = e.target.value; drawLeads(); };
  $('#src').onchange = e => { S.source = e.target.value; drawLeads(); };
  $$('[data-stage]').forEach(b => b.onclick = () => { S.stage = b.dataset.stage; S.shown = 60; renderLeads(); });
  $$('[data-layout]').forEach(b => b.onclick = () => { S.layout = b.dataset.layout; renderLeads(); });
  drawLeads();
}
function drawLeads(){
  const box = $('#lv'); if (!box) return;
  if (S.layout === 'board') return drawBoard(box);
  const rows = filtered();
  if (!rows.length) { box.innerHTML = `<div class="list"><div class="empty" style="margin:16px"><b>No leads match</b>${S.leads.length ? 'Try another stage or clear the search.' : 'New website enquiries will appear here automatically. You can also add a lead by hand.'}</div></div>`; return; }
  const now = Date.now();
  box.innerHTML = `<div class="list">
    <div class="lrow head"><span>Lead</span><span>Stage</span><span>Source</span><span>Owner</span><span style="text-align:right">Value</span><span>Received</span></div>
    ${rows.slice(0, S.shown).map(l => {
      const late = l.status === 'new' && now - new Date(l.created_at) > HOUR;
      const due = OPEN.includes(l.status) && l.next_action_at && new Date(l.next_action_at).getTime() <= endOfToday().getTime();
      const val = l.status === 'won' ? l.value : l.quote_value;
      return `<button class="lrow" data-lead="${l.id}">
        <span class="nm c-nm"><b>${l.status === 'new' ? '<i class="dot-new" aria-label="new"></i>' : ''}${esc(l.name || l.email || l.phone || 'No name')}</b><span>${esc([l.company, l.city].filter(Boolean).join(' · ') || l.email || l.phone || '')}</span></span>
        <span class="c-st">${pill(l.status)}</span>
        <span class="c-src"><span class="src">${SOURCES[l.source] || l.source}</span></span>
        <span class="c-own owner">${avatar(l.owner_id)}<span style="overflow:hidden;text-overflow:ellipsis">${esc(l.owner_id ? pname(l.owner_id) : 'Unassigned')}</span></span>
        <span class="val c-val">${val ? Rk(val) : ''}</span>
        <span class="when c-when ${late || due ? 'late' : ''}">${due ? (new Date(l.next_action_at) < new Date(new Date().setHours(0,0,0,0)) ? 'Overdue · ' + new Date(l.next_action_at).toLocaleDateString('en-ZA',{day:'numeric',month:'short'}) : 'Follow up today') : ago(l.created_at)}</span>
      </button>`; }).join('')}
  </div>${rows.length > S.shown ? `<div class="more"><button class="btn btn-line" id="more">Show more (${rows.length - S.shown} left)</button></div>` : ''}`;
  $('#more')?.addEventListener('click', () => { S.shown += 100; drawLeads(); });
}
function drawBoard(box){
  const rows = filtered().filter(l => S.stage === 'open' || true);
  const cols = [...OPEN, 'won', 'lost'];
  const recent = l => l.status === 'won' || l.status === 'lost' ? Date.now() - new Date(l.closed_at || l.updated_at) < 30*DAY : true;
  box.innerHTML = `<p class="hint" style="margin:-4px 0 10px">Drag a card to move it to the next stage. Won and Lost show the last 30 days.</p><div class="board">${cols.map(k => {
    const items = rows.filter(l => l.status === k && recent(l));
    const sum = items.reduce((s,l) => s + Number((k === 'won' ? l.value : l.quote_value) || 0), 0);
    return `<div class="bcol" data-col="${k}"><div class="bcol-h"><b>${SL[k]} · ${items.length}</b><span>${sum ? Rk(sum) : ''}</span></div>
      ${items.slice(0,80).map(l => `<button class="bcard" draggable="true" data-card="${l.id}" data-lead="${l.id}"><b>${esc(l.name || l.email || 'No name')}</b><span class="m"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.company || SOURCES[l.source] || '')}</span>${avatar(l.owner_id)}</span><span class="m"><span>${ago(l.created_at)}</span><span class="num">${(k === 'won' ? l.value : l.quote_value) ? Rk(k === 'won' ? l.value : l.quote_value) : ''}</span></span></button>`).join('')}
    </div>`; }).join('')}</div>`;
  $$('.bcard', box).forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.card); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  $$('.bcol', box).forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('drop'); const l = byId(e.dataTransfer.getData('text/plain')); if (l && l.status !== col.dataset.col) moveTo(l, col.dataset.col); });
  });
}

/* ================= STAGE CHANGES ================= */
async function saveLead(id, patch, msg){
  const {data, error} = await sb.from('leads').update(patch).eq('id', id).select().single();
  if (error) { toast('Could not save: ' + error.message); return null; }
  const i = S.leads.findIndex(l => l.id === id); if (i > -1) S.leads[i] = {...S.leads[i], ...data};
  if (msg) toast(msg);
  refresh();
  return data;
}
function moveTo(l, to){
  if (to === 'won') return wonModal(l);
  if (to === 'lost') return reasonModal(l, 'lost');
  if (to === 'disqualified') return reasonModal(l, 'disqualified');
  if (to === 'quoted') return quoteModal(l);
  const patch = {status:to};
  if (!l.owner_id && to !== 'new') patch.owner_id = S.me.id;
  return saveLead(l.id, patch, `Moved to ${SL[to]}`);
}
function refresh(){
  if (S.view === 'dash') renderDash(); else if (S.view === 'leads') drawLeads(); else renderTeam();
  const n = S.leads.filter(l => l.status === 'new').length;
  $$('[data-newcount]').forEach(b => { b.hidden = !n; b.textContent = n; });
  if (S.openId) drawDrawer();
}

/* ================= LEAD DRAWER ================= */
async function openLead(id){
  let l = byId(id);
  if (!l) { const {data} = await sb.from('leads').select('*').eq('id', id).maybeSingle(); if (!data) { toast('That lead could not be found.'); return; } S.leads.unshift(data); l = data; }
  S.openId = id; S.acts = [];
  if (!$('.drawer')) {
    const wrap = document.createElement('div'); wrap.id = 'dwrap';
    wrap.innerHTML = '<div class="scrim" data-close-d></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Lead details"></aside>';
    document.body.appendChild(wrap);
    wrap.querySelector('[data-close-d]').onclick = closeLead;
    document.body.style.overflow = 'hidden';
  }
  if (!location.hash.startsWith('#lead/')) history.pushState(null, '', '#lead/' + id);
  drawDrawer();
  loadActs();
}
function closeLead(){
  $('#dwrap')?.remove(); document.body.style.overflow = ''; S.openId = null;
  if (location.hash.startsWith('#lead/')) history.pushState(null, '', '#' + S.view);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.modal')) $('.modal').remove(); else if (S.openId) closeLead(); } });
async function loadActs(){
  const id = S.openId;
  const {data} = await sb.from('activities').select('*').eq('lead_id', id).order('created_at', {ascending:false});
  if (S.openId !== id) return;
  S.acts = data || []; drawTimeline();
}
function waNum(p){ let d = String(p||'').replace(/\D/g,''); if (d.startsWith('0')) d = '27' + d.slice(1); return d; }
function drawDrawer(){
  const l = byId(S.openId); const d = $('.drawer'); if (!l || !d) return;
  const closed = ['won','lost','disqualified'].includes(l.status);

  $('#d-next').onchange = e => saveLead(l.id, {next_action_at: e.target.value ? new Date(e.target.value + 'T08:00:00').toISOString() : null}, e.target.value ? 'Follow-up set for ' + dateOnly(e.target.value + 'T08:00:00') : 'Follow-up cleared');
  const money = (id, key) => { const el = $('#' + id); if (el) el.onchange = () => { const v = parseFloat(el.value.replace(/[^\d.]/g,'')); saveLead(l.id, {[key]: isFinite(v) ? v : null}, 'Value saved'); }; };
  money('d-qv', 'quote_value'); money('d-wv', 'value');
  $$('[data-ntype]', d).forEach(b => b.onclick = () => { S.noteType = b.dataset.ntype; $$('[data-ntype]', d).forEach(x => x.classList.toggle('on', x === b)); });
  $('#d-add').onclick = addNote;
  d.querySelector('[data-edit]').onclick = () => editModal(l);
  drawTimeline();
}
async function addNote(){
  const t = $('#d-note'), body = t.value.trim(); if (!body) { t.focus(); return; }
  const btn = $('#d-add'); btn.disabled = true;
  const {data, error} = await sb.from('activities').insert({lead_id:S.openId, user_id:S.me.id, type:S.noteType, body}).select().single();
  btn.disabled = false;
  if (error) { toast('Could not save note: ' + error.message); return; }
  t.value = ''; S.acts.unshift(data); drawTimeline();
  const l = byId(S.openId); if (l) { l.last_activity_at = data.created_at; if (['call','email','whatsapp','meeting'].includes(data.type) && !l.first_contact_at) l.first_contact_at = data.created_at; }
  if (l && l.status === 'new' && ['call','email','whatsapp','meeting'].includes(S.noteType)) toast('Saved. Tap "I\'ve contacted them" to move this lead on.');
  else toast('Note saved');
}
function drawTimeline(){
  const box = $('#tl'); if (!box) return;
  if (!S.acts.length) { box.innerHTML = '<div class="hint">No history yet.</div>'; return; }
  const icon = {note:ICON.note, call:ICON.phone, email:ICON.mail, whatsapp:ICON.wa, meeting:ICON.user, status:ICON.flag, assign:ICON.user, created:ICON.star, value:ICON.flag};
  box.innerHTML = S.acts.map(a => {
    let text = '';
    if (a.type === 'created') text = esc(a.body || 'Lead created');
    else if (a.type === 'status') text = `Moved from <b>${SL[a.meta?.from] || a.meta?.from}</b> to <b>${SL[a.meta?.to] || a.meta?.to}</b>${a.meta?.to === 'won' && a.meta?.value ? ' · ' + R(a.meta.value) : ''}${a.meta?.reason ? ' · ' + esc(a.meta.reason) : ''}`;
    else if (a.type === 'assign') text = a.meta?.to ? `Assigned to <b>${esc(pname(a.meta.to))}</b>` : 'Unassigned';
    else text = `<b>${NOTE_TYPES[a.type] || 'Note'}</b><div class="body">${esc(a.body)}</div>`;
    return `<div class="tl-i ${['status','assign','created'].includes(a.type) ? 'status' : 'note'}"><span class="tl-ic">${icon[a.type] || ICON.note}</span><div style="min-width:0"><div class="tl-t">${text}</div><div class="tl-m">${a.user_id ? esc(pname(a.user_id)) + ' · ' : a.type === 'created' ? 'Website · ' : ''}${dt(a.created_at)}</div></div></div>`;
  }).join('');
}

function modal(html, wide){
  $('.modal')?.remove();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="scrim" data-mclose></div><form class="mbox ${wide ? 'wide' : ''}" novalidate>${html}</form>`;
  document.body.appendChild(m);
  $$('[data-mclose]', m).forEach(b => b.onclick = e => { e.preventDefault(); m.remove(); });
  setTimeout(() => $('input:not([type=radio]),textarea,select', m)?.focus(), 40);

}

/* ================= LIVE UPDATES ================= */
function live(){
  sb.channel('kare-crm').on('postgres_changes', {event:'*', schema:'public', table:'leads'}, ({eventType, new:n, old:o}) => {
    if (eventType === 'INSERT') {
      if (byId(n.id)) return;
      S.leads.unshift(n);
      toast(`New lead: ${n.name || n.email || 'website enquiry'}`, 'Open', () => openLead(n.id));
    } else if (eventType === 'UPDATE') {
      const i = S.leads.findIndex(l => l.id === n.id); if (i > -1) S.leads[i] = {...S.leads[i], ...n}; else S.leads.unshift(n);
    } else if (eventType === 'DELETE') { S.leads = S.leads.filter(l => l.id !== o.id); }
    refresh();
  }).on('postgres_changes', {event:'INSERT', schema:'public', table:'activities'}, ({new:a}) => {
    if (a.lead_id === S.openId && !S.acts.some(x => x.id === a.id)) { S.acts.unshift(a); drawTimeline(); }
  }).subscribe();
}

/* ================= TOAST ================= */
function toast(msg, actLabel, act){
  $('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  if (actLabel) t.querySelector('button').onclick = () => { t.remove(); act(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), actLabel ? 9000 : 3500);
}

boot();
</script>
