<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Stop Work Shop Supply Store: Workshop Supplies for MTB &amp; Motorcycle Bays</title>
<meta name="description" content="Rim tape, cleaning supplies, tyre sealants and workshop essentials in retail and bulk sizes - one supplier for MTB and motorcycle workshops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =========================================================================
   ONE STOP WORK SHOP SUPPLY STORE - DESIGN SYSTEM
   Ink (off-black) + acid green, on a workshop off-white paper.
   Type: Space Grotesk (display/headers) + Inter (body/UI)
   ========================================================================= */

:root {
  --ink: #14171a;          /* off-black, slight blue-green undertone */
  --ink-soft: #1e2226;
  --ink-line: #2c3136;
  --green: #a6e600;        /* bright acid-lime green, primary accent */
  --green-deep: #4f7a00;   /* darker green for text on light backgrounds */
  --green-dim: #dff4a8;    /* pale green tint for backgrounds/badges */
  --paper: #f5f6f1;        /* off-white workshop paper */
  --paper-dim: #eceee6;
  --white: #ffffff;
  --steel: #6b7178;
  --steel-dark: #454a4f;
  --warn: #ffb020;
  --radius-s: 3px;
  --radius-m: 6px;
  --shadow-card: 0 1px 0 rgba(20, 23, 26, 0.06);
  --maxw: 1240px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .display {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 700;
  line-height: 1.12;
  margin: 0 0 0.5em;
  letter-spacing: -0.01em;
  color: var(--ink);
}

h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); }
h3 { font-size: 1.25rem; }
p { margin: 0 0 1em; max-width: 62ch; }
a { color: inherit; }
img { max-width: 100%; display: block; }
button { font-family: inherit; }

:focus-visible {
  outline: 3px solid var(--green);
  outline-offset: 2px;
}

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 20px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 2px solid transparent;
  border-radius: var(--radius-s);
  padding: 13px 22px;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  line-height: 1;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--green); color: var(--ink); border-color: var(--green); }
.btn-primary:hover { background: #b9fb14; border-color: #b9fb14; }
.btn-dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn-dark:hover { background: var(--ink-soft); }
.btn-outline { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-outline:hover { border-color: var(--green-deep); color: var(--green-deep); }
.btn-outline-light { background: transparent; color: var(--white); border-color: rgba(255,255,255,0.5); }
.btn-outline-light:hover { border-color: var(--green); color: var(--green); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- Header / Nav ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--ink);
  border-bottom: 1px solid var(--ink-line);
}
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  max-width: var(--maxw);
  margin: 0 auto;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  text-decoration: none;
  color: var(--white);
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  white-space: nowrap;
}
.brand .brand-mark { color: var(--green); }
.brand small { font-weight: 400; font-size: 0.65rem; color: var(--steel); display: block; letter-spacing: 0.02em; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 26px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: #cfd3d6;
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 500;
  padding: 6px 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.nav-links a:hover, .nav-links a.active { color: var(--white); border-color: var(--green); }

.nav-right { display: flex; align-items: center; gap: 14px; }

.cart-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--white);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 8px 12px;
  border: 1px solid var(--ink-line);
  border-radius: var(--radius-s);
}
.cart-link:hover { border-color: var(--green); }
.cart-badge {
  background: var(--green);
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
}

.nav-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--ink-line);
  border-radius: var(--radius-s);
  color: var(--white);
  padding: 8px 10px;
  cursor: pointer;
}

@media (max-width: 860px) {
  .nav-toggle { display: inline-flex; }
  .nav-links {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: var(--ink);
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    border-bottom: 1px solid var(--ink-line);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .nav-links.open { max-height: 420px; }
  .nav-links li { width: 100%; }
  .nav-links a { display: block; padding: 14px 20px; border-bottom: 1px solid var(--ink-line); border-left: 3px solid transparent; }
  .nav-links a:hover, .nav-links a.active { border-left-color: var(--green); border-bottom-color: var(--ink-line); }
  .site-header { position: sticky; }
  .nav-bar { position: relative; flex-wrap: wrap; }
}

/* ---------- Hero ---------- */
.hero {
  background: var(--ink);
  color: var(--white);
  position: relative;
  overflow: hidden;
  background-image: radial-gradient(circle, rgba(166,230,0,0.16) 1.4px, transparent 1.4px);
  background-size: 22px 22px;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(20,23,26,0.15) 0%, var(--ink) 92%);
}
.hero-inner {
  position: relative;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 76px 20px 64px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 40px;
  align-items: center;
}
@media (max-width: 900px) {
  .hero-inner { grid-template-columns: 1fr; padding: 48px 20px 40px; }
}
.hero-tag {
  display: inline-block;
  color: var(--green);
  font-weight: 600;
  font-size: 0.85rem;
  border: 1px solid var(--ink-line);
  border-radius: 999px;
  padding: 6px 14px;
  margin-bottom: 18px;
}
.hero h1 { color: var(--white); margin-bottom: 0.4em; }
.hero h1 .accent { color: var(--green); }
.hero p.lead { color: #c7ccd0; font-size: 1.08rem; max-width: 46ch; }
.hero-ctas { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
.hero-stats { display: flex; gap: 28px; margin-top: 40px; flex-wrap: wrap; }
.hero-stat b { display: block; font-family: "Space Grotesk", sans-serif; font-size: 1.7rem; color: var(--green); }
.hero-stat span { color: var(--steel); font-size: 0.82rem; }

.hero-visual {
  background: var(--ink-soft);
  border: 1px solid var(--ink-line);
  border-radius: var(--radius-m);
  overflow: hidden;
  aspect-ratio: 5 / 4;
}
.hero-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ---------- Section scaffolding ---------- */
.section { padding: 64px 0; }
.section-tight { padding: 40px 0; }
.section-dark { background: var(--ink); color: var(--white); }
.section-dark p { color: #c7ccd0; }
.section-dark h2 { color: var(--white); }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 34px;
  flex-wrap: wrap;
}
.section-head p { margin: 0; color: var(--steel); }

/* ---------- Category cards ---------- */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}
@media (max-width: 980px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .cat-grid { grid-template-columns: 1fr; } }

.cat-card {
  display: block;
  text-decoration: none;
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  padding: 24px;
  box-shadow: var(--shadow-card);
  transition: border-color 0.15s ease, transform 0.15s ease;
  position: relative;
}
.cat-card:hover { border-color: var(--green); transform: translateY(-2px); }
.cat-card .cat-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius-s);
  background: var(--green-dim);
  color: var(--green-deep);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.cat-card h3 { margin-bottom: 6px; }
.cat-card p { color: var(--steel); font-size: 0.92rem; margin-bottom: 12px; }
.cat-card .cat-count { font-size: 0.8rem; color: var(--green-deep); font-weight: 600; }

/* ---------- Product grid & cards ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}
@media (max-width: 1080px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .product-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }

.product-card {
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: var(--ink);
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.product-card:hover { border-color: var(--green); transform: translateY(-2px); }
.product-thumb {
  aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  background-image: radial-gradient(circle, rgba(166,230,0,0.14) 1px, transparent 1px), linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  background-size: 16px 16px, cover;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--green);
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  text-align: center;
  padding: 10px;
  position: relative;
}
.product-thumb img { width: 100%; height: 100%; object-fit: cover; }
.badge {
  position: absolute;
  top: 10px; left: 10px;
  background: var(--green);
  color: var(--ink);
  font-size: 0.68rem;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 999px;
}
.badge.badge-bulk { background: var(--warn); }
.product-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.product-cat-label { font-size: 0.72rem; color: var(--green-deep); font-weight: 600; }
.product-body h3 { font-size: 0.98rem; margin-bottom: 2px; line-height: 1.3; }
.product-short { color: var(--steel); font-size: 0.84rem; margin-bottom: 8px; flex: 1; }
.product-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.product-price { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1.05rem; }
.product-unit { color: var(--steel); font-size: 0.76rem; }

/* ---------- Filters (shop page) ---------- */
.shop-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 32px;
  align-items: start;
}
@media (max-width: 860px) { .shop-layout { grid-template-columns: 1fr; } }

.filters {
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  padding: 20px;
  position: sticky;
  top: 90px;
}
@media (max-width: 860px) { .filters { position: static; } }
.filters h4 { font-size: 0.78rem; text-transform: none; color: var(--steel); font-weight: 700; margin: 0 0 10px; }
.filter-group { margin-bottom: 22px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-option { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 0.9rem; cursor: pointer; }
.filter-option input { accent-color: var(--green-deep); width: 16px; height: 16px; }
.price-inputs { display: flex; gap: 8px; align-items: center; }
.price-inputs input { width: 100%; padding: 8px; border: 1px solid var(--paper-dim); border-radius: var(--radius-s); font-size: 0.85rem; }
select, input[type=text], input[type=email], input[type=tel], textarea {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 11px 12px;
  border: 1px solid #d7dad2;
  border-radius: var(--radius-s);
  background: var(--white);
  color: var(--ink);
  width: 100%;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--green); border-color: var(--green); }

.shop-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
.shop-toolbar .result-count { color: var(--steel); font-size: 0.88rem; }
.shop-toolbar select { width: auto; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--steel); }
.empty-state h3 { color: var(--ink); }

/* ---------- Product detail ---------- */
.product-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 44px;
  align-items: start;
}
@media (max-width: 860px) { .product-detail { grid-template-columns: 1fr; gap: 28px; } }
.pd-image {
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-m);
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  background-image: radial-gradient(circle, rgba(166,230,0,0.14) 1.4px, transparent 1.4px), linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  background-size: 20px 20px, cover;
  display: flex; align-items: center; justify-content: center;
  color: var(--green);
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  text-align: center;
  padding: 30px;
  position: sticky;
  top: 90px;
}
.pd-image img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-m); }
.pd-crumb { font-size: 0.82rem; color: var(--steel); margin-bottom: 14px; }
.pd-crumb a { color: var(--green-deep); text-decoration: none; }
.pd-price { font-family: "Space Grotesk", sans-serif; font-size: 2rem; font-weight: 700; margin: 14px 0 4px; }
.pd-unit { color: var(--steel); margin-bottom: 20px; }
.qty-row { display: flex; align-items: center; gap: 14px; margin: 20px 0; }
.qty-control { display: flex; align-items: center; border: 1px solid #d7dad2; border-radius: var(--radius-s); }
.qty-control button { border: none; background: var(--paper-dim); width: 40px; height: 44px; font-size: 1.1rem; cursor: pointer; }
.qty-control input { width: 52px; text-align: center; border: none; padding: 0; height: 44px; }
.pd-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.pd-specs { margin-top: 30px; border-top: 1px solid var(--paper-dim); padding-top: 22px; }
.pd-specs ul { list-style: none; padding: 0; margin: 0; }
.pd-specs li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--paper-dim); font-size: 0.9rem; }
.pd-specs li span:first-child { color: var(--steel); }
.added-toast {
  display: none;
  margin-top: 14px;
  background: var(--green-dim);
  color: var(--green-deep);
  border-radius: var(--radius-s);
  padding: 12px 14px;
  font-size: 0.88rem;
  font-weight: 600;
}
.added-toast.show { display: block; }

/* ---------- Reviews ---------- */
.review-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
@media (max-width: 760px) { .review-grid { grid-template-columns: 1fr; } }
.review-card {
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  padding: 22px;
}
.stars { color: var(--green-deep); font-size: 0.95rem; margin-bottom: 10px; letter-spacing: 2px; }
.review-card p { color: var(--ink); font-size: 0.95rem; }
.review-who { font-size: 0.84rem; color: var(--steel); margin-top: 10px; }
.review-who b { color: var(--ink); }

/* ---------- Stores strip ---------- */
.store-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.store-chip {
  background: var(--ink-soft);
  border: 1px solid var(--ink-line);
  color: var(--white);
  padding: 12px 18px;
  border-radius: var(--radius-s);
  font-size: 0.88rem;
  font-weight: 500;
}

/* ---------- Cart page ---------- */
.cart-table { width: 100%; border-collapse: collapse; }
.cart-table th { text-align: left; font-size: 0.78rem; color: var(--steel); font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--paper-dim); }
.cart-table td { padding: 16px 0; border-bottom: 1px solid var(--paper-dim); vertical-align: middle; }
.cart-item-info { display: flex; align-items: center; gap: 14px; }
.cart-thumb { width: 58px; height: 58px; border-radius: var(--radius-s); background: var(--ink); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 0.6rem; font-weight: 700; overflow: hidden; }
.cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-name { font-weight: 600; font-size: 0.94rem; }
.cart-item-unit { color: var(--steel); font-size: 0.8rem; }
.remove-link { color: var(--steel); font-size: 0.82rem; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
.remove-link:hover { color: #c0392b; }
.cart-summary {
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  padding: 24px;
  position: sticky;
  top: 90px;
}
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.94rem; }
.summary-row.total { font-weight: 700; font-size: 1.15rem; border-top: 1px solid var(--paper-dim); margin-top: 8px; padding-top: 14px; }
.cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start; }
@media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

/* ---------- Checkout ---------- */
.checkout-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: start; }
@media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } }
.field-row { margin-bottom: 16px; }
.field-row label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
.field-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .field-two { grid-template-columns: 1fr; } }
.order-box {
  background: var(--white);
  border: 1px solid var(--paper-dim);
  border-radius: var(--radius-m);
  padding: 22px;
}
.order-line { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid var(--paper-dim); }
.confirm-box {
  display: none;
  background: var(--ink);
  color: var(--white);
  border-radius: var(--radius-m);
  padding: 40px 30px;
  text-align: center;
}
.confirm-box.show { display: block; }
.confirm-box .order-number { font-family: "Space Grotesk", sans-serif; color: var(--green); font-size: 1.8rem; margin: 12px 0; }
.form-note { font-size: 0.82rem; color: var(--steel); margin-top: 10px; }

/* ---------- About / Testing pages ---------- */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: center; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.stat-block { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 30px; }
@media (max-width: 620px) { .stat-block { grid-template-columns: 1fr; } }
.stat-block div { border-top: 3px solid var(--green); padding-top: 12px; }
.stat-block b { display: block; font-family: "Space Grotesk", sans-serif; font-size: 2rem; }
.stat-block span { color: var(--steel); font-size: 0.85rem; }

.process-list { list-style: none; padding: 0; margin: 0; counter-reset: step; }
.process-list li {
  display: grid;

<script>
/* =========================================================================
   CART LOGIC - shared by every page via localStorage.
   Cart shape: { "p01": qty, "p07": qty, ... }
   ========================================================================= */

const CART_KEY = "oswss_cart_v1";

function formatPrice(amount) {
  return SITE_CONFIG.currencySymbol + Number(amount).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getProductById(id) {
  return PRODUCTS.find(p => p.id === id);
}

function readCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function writeCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}

function addToCart(id, qty) {
  qty = Math.max(1, parseInt(qty, 10) || 1);
  const cart = readCart();
  cart[id] = (cart[id] || 0) + qty;
  writeCart(cart);
}

function setCartQty(id, qty) {
  qty = parseInt(qty, 10) || 0;
  const cart = readCart();
  if (qty <= 0) {
    delete cart[id];
  } else {
    cart[id] = qty;
  }
  writeCart(cart);
}

function removeFromCart(id) {
  const cart = readCart();
  delete cart[id];
  writeCart(cart);
}

function clearCart() {
  localStorage.removeItem(CART_KEY);
  updateCartBadge();
}

function cartLineItems() {
  const cart = readCart();
  return Object.keys(cart).map(id => {
    const product = getProductById(id);
    if (!product) return null;
    return { product, qty: cart[id], lineTotal: product.price * cart[id] };
  }).filter(Boolean);
}

function cartCount() {
  const cart = readCart();
  return Object.values(cart).reduce((sum, qty) => sum + qty, 0);
}

function cartSubtotal() {
  return cartLineItems().reduce((sum, item) => sum + item.lineTotal, 0);
}

function updateCartBadge() {
  document.querySelectorAll("[data-cart-count]").forEach(el => {
    const count = cartCount();
    el.textContent = count;
    el.style.display = count > 0 ? "inline-flex" : "none";
  });
}

function generateOrderNumber() {
  const now = new Date();
  const stamp = now.getFullYear().toString().slice(2) +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0");
  const rand = Math.floor(1000 + Math.random() * 9000);
  return "OSWS-" + stamp + "-" + rand;
}

document.addEventListener("DOMContentLoaded", updateCartBadge);

</script>

function attachShopEvents() {
  function buildCategoryFilters() {
    const mount = document.getElementById("categoryFilters");
    mount.innerHTML = CATEGORIES.map(c => `
      <label class="filter-option">
        <input type="checkbox" value="${c.slug}" class="cat-filter" ${shopState.categories.has(c.slug) ? "checked" : ""}>
        ${c.name}
      </label>`).join("");
    mount.querySelectorAll(".cat-filter").forEach(cb => {
      cb.addEventListener("change", () => {
        cb.checked ? shopState.categories.add(cb.value) : shopState.categories.delete(cb.value);
        applyFilters();
      });
    });
  }
  function applyFilters() {
    let results = PRODUCTS.slice();
    if (shopState.categories.size) results = results.filter(p => shopState.categories.has(p.category));
    if (shopState.badges.size) results = results.filter(p => shopState.badges.has(p.badge));
    if (shopState.priceMin !== null && !isNaN(shopState.priceMin)) results = results.filter(p => p.price >= shopState.priceMin);
    if (shopState.priceMax !== null && !isNaN(shopState.priceMax)) results = results.filter(p => p.price <= shopState.priceMax);
    if (shopState.sort === "price-asc") results.sort((a,b) => a.price - b.price);
    if (shopState.sort === "price-desc") results.sort((a,b) => b.price - a.price);
    if (shopState.sort === "name-asc") results.sort((a,b) => a.name.localeCompare(b.name));
    document.getElementById("resultCount").textContent = results.length + " product" + (results.length === 1 ? "" : "s");
    document.getElementById("shopGrid").innerHTML = productGridHTML(results);
  }
  document.querySelectorAll(".badge-filter").forEach(cb => {
    cb.addEventListener("change", () => {
      cb.checked ? shopState.badges.add(cb.value) : shopState.badges.delete(cb.value);
      applyFilters();
    });
  });
  document.getElementById("priceMin").addEventListener("input", (e) => { shopState.priceMin = e.target.value ? parseFloat(e.target.value) : null; applyFilters(); });
  document.getElementById("priceMax").addEventListener("input", (e) => { shopState.priceMax = e.target.value ? parseFloat(e.target.value) : null; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", (e) => { shopState.sort = e.target.value; applyFilters(); });
  document.getElementById("clearFilters").addEventListener("click", () => {
    shopState = { categories: new Set(), badges: new Set(), priceMin: null, priceMax: null, sort: "default" };
    document.getElementById("priceMin").value = "";
    document.getElementById("priceMax").value = "";
    document.getElementById("sortSelect").value = "default";
    document.querySelectorAll(".badge-filter").forEach(cb => cb.checked = false);
    buildCategoryFilters();
    applyFilters();
  });
  buildCategoryFilters();
  applyFilters();
}

function attachProductEvents(id) {
  const product = getProductById(id);
  if (!product) return;
  const qtyInput = document.getElementById("qtyInput");
  const lineTotalEl = document.getElementById("lineTotal");
  function refreshLineTotal() {
    const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
    lineTotalEl.textContent = qty > 1 ? ("Line total: " + formatPrice(qty * product.price)) : "";
  }
  document.getElementById("qtyMinus").addEventListener("click", () => {
    qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);
    refreshLineTotal();
  });
  document.getElementById("qtyPlus").addEventListener("click", () => {
    qtyInput.value = (parseInt(qtyInput.value, 10) || 1) + 1;
    refreshLineTotal();
  });
  qtyInput.addEventListener("input", refreshLineTotal);
  document.getElementById("addToCartBtn").addEventListener("click", () => {
    addToCart(product.id, qtyInput.value);
    const toast = document.getElementById("addedToast");
    toast.textContent = `Added ${qtyInput.value} × ${product.name} to your cart.`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3200);
  });
}

function renderCartInner() {

    return;
  }
  const rows = items.map(item => `
    <tr>
      <td>
        <div class="cart-item-info">
          <div class="cart-thumb">${item.product.image ? `<img src="${item.product.image}" alt="">` : ""}</div>
          <div>
            <div class="cart-item-name"><a href="#/product/${item.product.id}" style="color:inherit; text-decoration:none;">${item.product.name}</a></div>
            <div class="cart-item-unit">${formatPrice(item.product.price)} / ${item.product.unit}</div>
          </div>
        </div>
      </td>
      <td>
        <div class="qty-control">
          <button type="button" class="qty-dec" data-id="${item.product.id}">&minus;</button>
          <input type="text" class="qty-field" data-id="${item.product.id}" value="${item.qty}" inputmode="numeric" style="width:44px;">
          <button type="button" class="qty-inc" data-id="${item.product.id}">+</button>
        </div>
      </td>
      <td><strong>${formatPrice(item.lineTotal)}</strong></td>
      <td><button class="remove-link" data-id="${item.product.id}">Remove</button></td>
    </tr>`).join("");

  const subtotal = cartSubtotal();
  const freeDeliveryNote = subtotal >= SITE_CONFIG.freeDeliveryThreshold
    ? "Qualifies for free delivery."
    : `Add ${formatPrice(SITE_CONFIG.freeDeliveryThreshold - subtotal)} more for free delivery.`;

  wrap.innerHTML = `
    <div class="cart-layout">
      <div>
        <table class="cart-table">
          <thead><tr><th>Product</th><th>Quantity</th><th>Total</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="cart-summary">
        <h3 style="margin-bottom:16px;">Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Delivery</span><span>Calculated on confirmation</span></div>
        <div class="summary-row total"><span>Estimated total</span><span>${formatPrice(subtotal)}</span></div>
        <p class="small-note" style="margin-top:10px;">${freeDeliveryNote}</p>
        <a href="#/checkout" class="btn btn-primary btn-block" style="margin-top:16px;">Place order</a>
        <a href="#/shop" class="btn btn-outline btn-block" style="margin-top:10px;">Continue shopping</a>
      </div>
    </div>`;

  wrap.querySelectorAll(".qty-inc").forEach(btn => btn.addEventListener("click", () => {
    const cart = readCart();
    setCartQty(btn.dataset.id, (cart[btn.dataset.id] || 0) + 1);
    renderCartInner();
  }));
  wrap.querySelectorAll(".qty-dec").forEach(btn => btn.addEventListener("click", () => {
    const cart = readCart();
    setCartQty(btn.dataset.id, (cart[btn.dataset.id] || 0) - 1);
    renderCartInner();
  }));
  wrap.querySelectorAll(".qty-field").forEach(input => input.addEventListener("change", () => {
    setCartQty(input.dataset.id, input.value);
    renderCartInner();
  }));
  wrap.querySelectorAll(".remove-link").forEach(btn => btn.addEventListener("click", () => {
    removeFromCart(btn.dataset.id);
    renderCartInner();
  }));
}

function buildOrderBodyText(orderNumber, details, items) {
  const lines = items.map(item => `- ${item.qty} x ${item.product.name} (${item.product.id}) @ ${formatPrice(item.product.price)} = ${formatPrice(item.lineTotal)}`).join("\n");
  return `New order: ${orderNumber}\n\n` +
    `Customer: ${details.fullName}\n` +
    `Workshop / business: ${details.businessName || "-"}\n` +
    `Email: ${details.email}\n` +
    `Phone: ${details.phone}\n` +
    `Delivery address: ${details.address}\n` +
    `Notes: ${details.notes || "-"}\n\n` +
    `Order items:\n${lines}\n\n` +
    `Estimated total: ${formatPrice(items.reduce((s, i) => s + i.lineTotal, 0))}\n` +
    `(Final total to be confirmed with delivery cost.)`;
}

function downloadInvoicePDF(order) {
  if (!window.jspdf) {
    alert("The invoice tool didn't load (check your internet connection) so no PDF could be generated. Your order details are shown on screen, please save a screenshot as backup.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginX = 15;
  let y = 20;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(SITE_CONFIG.businessName, marginX, y);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  y += 7;
  doc.text(SITE_CONFIG.location, marginX, y);
  y += 5;
  doc.text(SITE_CONFIG.businessEmail, marginX, y);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text("Order Invoice", 150, 20);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text("Order #: " + order.order_number, 150, 27);
  doc.text("Date: " + new Date(order.created_at || Date.now()).toLocaleDateString(), 150, 32);

  y = 45;
  doc.setDrawColor(210);
  doc.line(marginX, y, 195, y);
  y += 8;

  doc.setFont("helvetica", "bold");
  doc.text("Billed to", marginX, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  doc.text(order.customer_name || "", marginX, y); y += 5;
  if (order.business_name) { doc.text(order.business_name, marginX, y); y += 5; }
  doc.text(order.customer_email || "", marginX, y); y += 5;
  doc.text(order.phone || "", marginX, y); y += 5;
  const addressLines = doc.splitTextToSize(order.address || "", 90);
  doc.text(addressLines, marginX, y);
  y += addressLines.length * 5 + 6;

  doc.setFont("helvetica", "bold");
  doc.text("Item", marginX, y);
  doc.text("Qty", 145, y);
  doc.text("Total", 172, y);
  y += 3;
  doc.line(marginX, y, 195, y);
  y += 6;
  doc.setFont("helvetica", "normal");

  order.items.forEach(item => {
    const nameLines = doc.splitTextToSize(item.name, 118);
    doc.text(nameLines, marginX, y);
    doc.text(String(item.qty), 145, y);
    doc.text(formatPrice(item.lineTotal), 172, y);
    y += nameLines.length * 5 + 3;
    if (y > 270) { doc.addPage(); y = 20; }
  });

  y += 4;
  doc.line(marginX, y, 195, y);
  y += 8;
  doc.setFont("helvetica", "bold");
  doc.text("Total: " + formatPrice(order.total), 145, y);

  y += 14;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text("This is an order confirmation, not a tax invoice. Final total confirmed with delivery cost.", marginX, y);

  doc.save(order.order_number + "-invoice.pdf");
}

function attachCheckoutEvents() {
  const form = document.getElementById("orderForm");
  if (!form) return;
  const items = cartLineItems();

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!items.length) return;
    const details = {
      fullName: document.getElementById("fullName").value.trim(),
      businessName: document.getElementById("businessName").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      address: document.getElementById("address").value.trim(),
      notes: document.getElementById("notes").value.trim()
    };
    const orderNumber = generateOrderNumber();
    const btn = document.getElementById("placeOrderBtn");
    btn.disabled = true;
    btn.textContent = "Placing your order...";

    const orderRecord = {
      order_number: orderNumber,
      customer_email: details.email,
      customer_name: details.fullName,
      business_name: details.businessName || null,
      phone: details.phone,
      address: details.address,
      notes: details.notes || null,
      items: items.map(i => ({ id: i.product.id, name: i.product.name, qty: i.qty, price: i.product.price, lineTotal: i.lineTotal })),
      total: cartSubtotal(),
      created_at: new Date().toISOString()
    };

    let saved = false;
    if (sb) {
      const { error } = await sb.from("orders").insert(orderRecord);
      saved = !error;
      if (error) console.error("Order history save failed:", error.message);
    }

    downloadInvoicePDF(orderRecord);

    document.getElementById("checkoutSection").style.display = "none";
    document.getElementById("confirmSection").style.display = "block";
    document.getElementById("confirmedOrderNumber").textContent = orderNumber;

    const msgEl = document.getElementById("confirmedMessage");
    const actionsEl = document.getElementById("confirmActions");
    if (saved) {
      msgEl.textContent = `Your invoice has downloaded. This order is also saved under ${details.email}, view it anytime under My Orders.`;
      actionsEl.innerHTML = `<a href="#/orders" class="btn btn-primary">View my orders</a><a href="#/shop" class="btn btn-outline-light">Continue shopping</a>`;
    } else {
      const mailBody = encodeURIComponent(buildOrderBodyText(orderNumber, details, items));
      const mailSubject = encodeURIComponent("New order " + orderNumber);
      msgEl.textContent = "Your invoice has downloaded. We couldn't save this to order history automatically, so please email us a copy as backup.";
      actionsEl.innerHTML = `<a href="mailto:${SITE_CONFIG.businessEmail}?subject=${mailSubject}&body=${mailBody}" class="btn btn-primary">Email us a copy</a><a href="#/shop" class="btn btn-outline-light">Continue shopping</a>`;
    }
    clearCart();
  });
}

function renderOrdersLogin() {
  const wrap = document.getElementById("ordersWrap");
  wrap.innerHTML = `
    <div class="order-box" style="max-width:420px; margin:0 auto;">
      <h3 style="margin-bottom:6px;">View your order history</h3>
      <p class="small-note" style="margin-bottom:16px;">Enter the email you order under. We'll send a 6-digit code to confirm it's you.</p>
      <div id="loginStep1">
        <div class="field-row"><label for="loginEmail">Email</label><input type="email" id="loginEmail"></div>
        <button class="btn btn-primary btn-block" id="sendCodeBtn">Send me a code</button>
      </div>
      <div id="loginStep2" style="display:none; margin-top:16px;">
        <div class="field-row"><label for="loginCode">6-digit code</label><input type="text" id="loginCode" inputmode="numeric"></div>
        <button class="btn btn-primary btn-block" id="verifyCodeBtn">Verify &amp; view orders</button>
      </div>
      <p class="small-note" id="loginMsg" style="margin-top:12px;"></p>
    </div>`;

  let pendingEmail = "";

  document.getElementById("sendCodeBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const msg = document.getElementById("loginMsg");
    if (!email) return;
    msg.textContent = "Sending code...";
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    if (error) { msg.textContent = "Couldn't send a code: " + error.message; return; }
    pendingEmail = email;
    document.getElementById("loginStep1").style.display = "none";
    document.getElementById("loginStep2").style.display = "block";
    msg.textContent = "Check your email for a 6-digit code.";
  });

  document.getElementById("verifyCodeBtn").addEventListener("click", async () => {
    const code = document.getElementById("loginCode").value.trim();
    const msg = document.getElementById("loginMsg");
    if (!code) return;
    msg.textContent = "Checking...";
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: "email" });
    if (error) { msg.textContent = "That code didn't work: " + error.message; return; }
    renderOrdersList(pendingEmail);
  });
}

  }

  wrap.innerHTML = `
    <p class="small-note" style="margin-bottom:16px;">Signed in as ${email}. <button class="remove-link" id="signOutBtn">Sign out</button></p>
    ${data.map((order, idx) => `
      <div class="order-box" style="margin-bottom:16px;">
        <div class="shop-toolbar" style="margin-bottom:10px;">
          <div><strong>${order.order_number}</strong><br><span class="small-note">${new Date(order.created_at).toLocaleDateString()}</span></div>
          <div style="text-align:right;"><strong>${formatPrice(order.total)}</strong><br><span class="small-note">${order.status || "pending"}</span></div>
        </div>
        ${order.items.map(i => `<div class="order-line"><span>${i.qty} × ${i.name}</span><span>${formatPrice(i.lineTotal)}</span></div>`).join("")}
        <div class="pd-actions" style="margin-top:14px;">
          <button class="btn btn-outline btn-sm reorder-btn" data-idx="${idx}">Reorder these items</button>
          <button class="btn btn-outline btn-sm download-btn" data-idx="${idx}">Download invoice</button>
        </div>
      </div>`).join("")}
  `;

  document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); renderOrdersLogin(); });
  wrap.querySelectorAll(".reorder-btn").forEach(btn => btn.addEventListener("click", () => {
    const order = data[parseInt(btn.dataset.idx, 10)];
    order.items.forEach(i => addToCart(i.id, i.qty));
    window.location.hash = "#/cart";
  }));
  wrap.querySelectorAll(".download-btn").forEach(btn => btn.addEventListener("click", () => {
    downloadInvoicePDF(data[parseInt(btn.dataset.idx, 10)]);
  }));
}

/* ---------------------------- ROUTER ---------------------------- */
function router() {
  const raw = location.hash.slice(1) || "/";
  const [path, queryString] = raw.split("?");
  const params = new URLSearchParams(queryString || "");
  const segments = path.split("/").filter(Boolean);
  const view = document.getElementById("view");

  if (segments.length === 0) {
    view.innerHTML = viewHome();
    setActiveNav("/");
  } else if (segments[0] === "shop") {
    view.innerHTML = viewShop(params);
    attachShopEvents();
    setActiveNav("/shop");
  } else if (segments[0] === "product") {
    view.innerHTML = viewProduct(segments[1]);
    attachProductEvents(segments[1]);
    setActiveNav("");
  } else if (segments[0] === "cart") {
    view.innerHTML = viewCart();
    renderCartInner();
    setActiveNav("");
  } else if (segments[0] === "checkout") {
    view.innerHTML = viewCheckout();
    attachCheckoutEvents();
    setActiveNav("");
  } else if (segments[0] === "orders") {
    view.innerHTML = viewOrders();
    attachOrdersEvents();
    setActiveNav("/orders");
  } else if (segments[0] === "about") {
    view.innerHTML = viewAbout();
    setActiveNav("/about");
  } else if (segments[0] === "testing") {
    view.innerHTML = viewTesting();
    setActiveNav("/testing");
  } else {
    view.innerHTML = `<section class="section"><div class="wrap empty-state"><h3>Page not found</h3><a href="#/" class="btn btn-primary">Back to home</a></div></section>`;
    setActiveNav("");
  }
  window.scrollTo(0, 0);
  updateCartBadge();
}

window.addEventListener("hashchange", router);
document.addEventListener("DOMContentLoaded", () => {
  renderChrome();
  router();
});
